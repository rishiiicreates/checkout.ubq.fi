name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: foundry-rs/foundry-toolchain@v1.9.0
        with:
          version: stable

      - run: deno task check

      - run: deno task test:anvil
